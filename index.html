    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; }
        .card { background-color: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); border: 1px solid #334155; }
        .select-box { background-color: #334155; color: white; border: 1px solid #475569; transition: all 0.2s; }
        .select-box:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }
        .reel-item { transition: all 0.2s; }
        .reel-item:hover { transform: translateX(4px); }
        .verdict-excellent { background: rgba(34, 197, 94, 0.15); border-color: #22c55e; color: #86efac; }
        .verdict-good { background: rgba(59, 130, 246, 0.15); border-color: #3b82f6; color: #93c5fd; }
        .verdict-strong { background: rgba(234, 179, 8, 0.15); border-color: #eab308; color: #fde047; }
        .verdict-weak { background: rgba(239, 68, 68, 0.15); border-color: #ef4444; color: #fca5a5; }
        .filter-btn { transition: all 0.2s; }
        .filter-btn.active { background-color: #3b82f6; color: white; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>

            <div>
                <label class="block text-sm font-medium text-slate-400 mb-2" id="label-rod-type">Тип удилища</label>
                <div class="flex flex-wrap gap-2" id="rod-type-filters">
                    <button onclick="setRodType('all')" class="filter-btn active px-3 py-1 rounded-lg bg-slate-700 text-slate-300 text-sm" data-type="all">Все</button>
                    <button onclick="setRodType('spinning')" class="filter-btn px-3 py-1 rounded-lg bg-slate-700 text-slate-300 text-sm" data-type="spinning">Спиннинг</button>
                    <button onclick="setRodType('casting')" class="filter-btn px-3 py-1 rounded-lg bg-slate-700 text-slate-300 text-sm" data-type="casting">Кастинг</button>
                    <button onclick="setRodType('feeder')" class="filter-btn px-3 py-1 rounded-lg bg-slate-700 text-slate-300 text-sm" data-type="feeder">Фидер</button>
                    <button onclick="setRodType('match')" class="filter-btn px-3 py-1 rounded-lg bg-slate-700 text-slate-300 text-sm" data-type="match">Матч</button>
                    <button onclick="setRodType('telescopic')" class="filter-btn px-3 py-1 rounded-lg bg-slate-700 text-slate-300 text-sm" data-type="telescopic">Телескоп</button>
                    <button onclick="setRodType('carp')" class="filter-btn px-3 py-1 rounded-lg bg-slate-700 text-slate-300 text-sm" data-type="carp">Карп</button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-400 mb-2" id="label-rod">Удилище</label>
                <select id="rod-select" class="select-box w-full rounded-lg p-3" onchange="calculate()">
                    <option value="">--</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-400 mb-2" id="label-line">Леска / Поводок</label>
                <select id="line-select" class="select-box w-full rounded-lg p-3" onchange="calculate()">
                    <option value="">--</option>
                </select>
                <p id="line-tip" class="text-xs text-yellow-400 mt-2 hidden">💡 <span id="line-tip-text"></span></p>
            </div>

            <div id="result-box" class="hidden border-t border-slate-700 pt-6 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-slate-800/50 rounded-lg p-4">
                        <div class="text-slate-400 text-sm mb-1" id="res-drag-label">Настройка фрикциона:</div>
                        <div id="res-drag" class="text-2xl font-bold text-blue-400">--</div>
                    </div>
                    <div class="bg-slate-800/50 rounded-lg p-4">

                        <div id="res-max" class="text-2xl font-bold text-green-400">--</div>
                    </div>
                </div>

                    </div>

                </div>
            </div>
        </div>

    function getRodTypeForReel(rodType) {
        return rodType === 'casting' ? 'casting' : 'spinning';
    }

    function calculateVerdict(reelPower, maxRecommended) {
        if (reelPower > maxRecommended * 1.15) return 'strong';
        if (reelPower >= maxRecommended * 0.95) return 'excellent';
        if (reelPower >= maxRecommended * 0.8) return 'good';
        return 'weak';
    }

    function getDragSetting(ratio) {
        const t = i18n[currentLang];
        if (ratio >= 0.95 && ratio <= 1.05) return { text: currentLang === 'ru' ? "на 7/8 или 11/12" : "at 7/8 or 11/12", maxMultiplier: 1.0 };
        if (ratio > 1.05 && ratio <= 1.15) return { text: currentLang === 'ru' ? "на 5/6 или 10/12" : "at 5/6 or 10/12", maxMultiplier: 1.15 };
        if (ratio > 1.15) return { text: currentLang === 'ru' ? "на максимум" : "to maximum", maxMultiplier: 1.3, warning: true };
        return { text: currentLang === 'ru' ? "на 3/4" : "at 3/4", maxMultiplier: 0.85, weakWarning: true };
    }

    function calculate() {
        const rodId = document.getElementById('rod-select').value;
        const lineId = document.getElementById('line-select').value;
        const resultBox = document.getElementById('result-box');
        const lineTip = document.getElementById('line-tip');

        if (!rodId || !lineId) { resultBox.classList.add('hidden'); return; }

        const rod = rods.find(r => r.id == rodId);
        const line = lines.find(l => l.id == lineId);
        const t = i18n[currentLang];

        if (line.isLeader) {
            lineTip.classList.remove('hidden');
            document.getElementById('line-tip-text').textContent = t.lineTip;
        } else { lineTip.classList.add('hidden'); }

        const ratio = line.power / rod.power;
        const dragInfo = getDragSetting(ratio);
        const maxRecommended = rod.power * dragInfo.maxMultiplier;

        document.getElementById('res-drag').textContent = dragInfo.text;
        document.getElementById('res-max').textContent = maxRecommended.toFixed(2) + ' ' + t.kg;

        const warningBox = document.getElementById('res-warning');
        if (dragInfo.warning) {
            document.getElementById('res-warning-text').textContent = t.warningStrong;
            warningBox.classList.remove('hidden');
        } else if (dragInfo.weakWarning) {
            document.getElementById('res-warning-text').textContent = t.warningWeak;
            warningBox.classList.remove('hidden');
        } else { warningBox.classList.add('hidden'); }

        const requiredReelType = getRodTypeForReel(rod.type);
        const playerLevel = parseInt(document.getElementById('level-filter').value);

        const suitableReels = reels
            .filter(r => r.type === requiredReelType && r.level <= playerLevel)
            .map(r => ({ ...r, verdict: calculateVerdict(r.power, maxRecommended) }))
            .sort((a, b) => {
                const order = { excellent: 0, good: 1, strong: 2, weak: 3 };
                return order[a.verdict] - order[b.verdict] || a.power - b.power;
            });

        const reelList = document.getElementById('reel-list');
        reelList.innerHTML = '';
        document.getElementById('reel-count').textContent = `(${suitableReels.length})`;

        if (suitableReels.length === 0) {
            reelList.innerHTML = `<div class="text-slate-500 text-center py-4">${currentLang === 'ru' ? 'Нет доступных катушек' : 'No reels available'}</div>`;
        } else {
            suitableReels.forEach(r => {
                const verdictClass = `verdict-${r.verdict}`;
                const verdictText = t[`verdict${r.verdict.charAt(0).toUpperCase() + r.verdict.slice(1)}`];
                const reelName = currentLang === 'ru' ? r.nameRu : r.nameEn;
                const reelTypeName = t.reelTypeNames[r.type];
                const div = document.createElement('div');
                div.className = `reel-item ${verdictClass} border rounded-lg p-3 flex justify-between items-center`;
                div.innerHTML = `<div><div class="font-semibold">${reelName}</div><div class="text-xs opacity-75">${reelTypeName} · ${t.level} ${r.level} · ${r.power} ${t.kg} · ${r.speed} см/об</div></div><div class="font-bold text-sm">${verdictText}</div>`;
                reelList.appendChild(div);
            });
        }
        resultBox.classList.remove('hidden');
    }

    function filterData() {
        const playerLevel = parseInt(document.getElementById('level-filter').value);
        const t = i18n[currentLang];

        const rodSelect = document.getElementById('rod-select');
        const currentRod = rodSelect.value;
        rodSelect.innerHTML = `<option value="">${t.placeholderRod}</option>`;
        rods.filter(r => r.level <= playerLevel && (currentRodType === 'all' || r.type === currentRodType))
            .forEach(rod => {
                const opt = document.createElement('option');
                opt.value = rod.id;
                opt.textContent = `[${t.level} ${rod.level}] ${currentLang === 'ru' ? rod.nameRu : rod.nameEn} — ${rod.power}${t.kg}`;
                if (rod.id == currentRod) opt.selected = true;
                rodSelect.appendChild(opt);
            });

        const lineSelect = document.getElementById('line-select');
        const currentLine = lineSelect.value;
        lineSelect.innerHTML = `<option value="">${t.placeholderLine}</option>`;
        lines.filter(l => l.level <= playerLevel)
            .forEach(line => {
                const opt = document.createElement('option');
                opt.value = line.id;
                const typeName = t.lineTypeNames[line.type] || line.type;
                const leaderMark = line.isLeader ? (currentLang === 'ru' ? ' [П]' : ' [L]') : '';
                opt.textContent = `[${t.level} ${line.level}] ${currentLang === 'ru' ? line.nameRu : line.nameEn} — ${line.power}${t.kg}${leaderMark}`;
                if (line.id == currentLine) opt.selected = true;
                lineSelect.appendChild(opt);
            });
        calculate();
    }

    function setRodType(type) {
        currentRodType = type;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.type === type));
        document.getElementById('rod-select').value = '';
        filterData();
    }

    function updateLevelDisplay() {
        document.getElementById('level-display').textContent = document.getElementById('level-filter').value;
    }

    function setLang(lang) {
        currentLang = lang;
        const t = i18n[lang];
        document.getElementById('btn-ru').className = lang === 'ru' ? "px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold transition hover:bg-blue-700" : "px-4 py-2 rounded-lg bg-slate-700 text-slate-300 font-semibold transition hover:bg-slate-600";
        document.getElementById('btn-en').className = lang === 'en' ? "px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold transition hover:bg-blue-700" : "px-4 py-2 rounded-lg bg-slate-700 text-slate-300 font-semibold transition hover:bg-slate-600";
        document.getElementById('subtitle').textContent = t.subtitle;
        document.getElementById('label-level').textContent = t.labelLevel;
        document.getElementById('label-rod-type').textContent = t.labelRodType;
        document.getElementById('label-rod').textContent = t.labelRod;
        document.getElementById('label-line').textContent = t.labelLine;
        document.getElementById('res-drag-label').textContent = t.dragLabel;
        document.getElementById('res-max-label').textContent = t.maxLabel;
        document.getElementById('res-reels-label').textContent = t.reelsLabel;
        document.getElementById('footer-text').textContent = t.footer;
        document.querySelectorAll('.filter-btn').forEach(btn => { btn.textContent = t.rodTypes[btn.dataset.type] || btn.dataset.type; });
        filterData();
    }

    filterData();
    </script>
